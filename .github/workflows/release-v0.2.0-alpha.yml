name: Release v0.2.0-alpha

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v0.2.0-alpha.yml'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ACNH-NHI-Builder.sln

      - name: Build
        run: dotnet build ACNH-NHI-Builder.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ACNH-NHI-Builder.sln --configuration Release --no-build

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish src/ACNH.NHI.Builder.App/ACNH.NHI.Builder.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish/win-x64
          Copy-Item README.md publish/win-x64/README.md
          Copy-Item LICENSE publish/win-x64/LICENSE

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath ACNH-NHI-Builder-v0.2.0-alpha-win-x64.zip -Force

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0-alpha `
            ACNH-NHI-Builder-v0.2.0-alpha-win-x64.zip `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "ACNH NHI Builder v0.2.0-alpha" `
            --prerelease `
            --notes "Première alpha du générateur réellement fonctionnel. Nouveau thème sombre violet/cyan avec fond complet et barre de titre sombre, chargement persistant du dossier NHSE, noms français, catégories et sous-catégories, recherche, presets, sprites locaux NHSE quand disponibles, piles maximales, ajout de plusieurs piles/exemplaires, compteur 9000 et génération/enregistrement .nhi. Les variantes de corps/personnalisations qui partagent un même ID restent la prochaine étape."
